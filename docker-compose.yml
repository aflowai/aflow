# =============================================================================
# Aflow Platform - Local Development Infrastructure
# =============================================================================
# Start with: yarn infra:up
# Stop with:  docker compose down
# Reset data: docker compose down -v
#
# Data lives in volumes named after the project. A checkout whose data was
# created under another project name keeps it by setting COMPOSE_PROJECT_NAME
# to that name in .env, which takes precedence over the name below.
# =============================================================================

name: aflow-dev

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  # On loopback with its fixed login: a generated one is its own slice
  # (Plan 315 D20), because DATABASE_URL reaches every tool and Postgres test.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: phoenix
      POSTGRES_DB: phoenix
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U phoenix -d phoenix']
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis (Streams + Pub/Sub + Hot State)
  # ---------------------------------------------------------------------------
  # Every checkout on the machine shares this container, so its password is the
  # machine's, in ~/.aflow/stack.env; `yarn infra:up` passes it here as
  # AFLOW_DEV_REDIS_PASSWORD (scripts/infra.mjs). It holds the write approvals
  # the push gate reads, so it never starts without one.
  redis:
    image: redis:7-alpine
    container_name: aflow-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    environment:
      AFLOW_DEV_REDIS_PASSWORD: ${AFLOW_DEV_REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -z "$$AFLOW_DEV_REDIS_PASSWORD" ]; then
          echo 'Redis not started: no password from ~/.aflow/stack.env. Run yarn redis:password.' >&2
          exit 1
        fi
        exec docker-entrypoint.sh redis-server --appendonly yes --requirepass "$$AFLOW_DEV_REDIS_PASSWORD"
    healthcheck:
      test:
        ['CMD-SHELL', 'REDISCLI_AUTH="$$AFLOW_DEV_REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis Commander (Optional - Web UI for Redis)
  # ---------------------------------------------------------------------------
  # Behind the Redis password, as user aflow: a browser on this machine that
  # reached it without one would hold everything the password guards.
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: aflow-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:${AFLOW_DEV_REDIS_PASSWORD:-}
      HTTP_USER: aflow
      HTTP_PASSWORD: ${AFLOW_DEV_REDIS_PASSWORD:-}
    ports:
      - '127.0.0.1:8081:8081'
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - tools

  # ---------------------------------------------------------------------------
  # pgAdmin (Optional - Web UI for PostgreSQL)
  # ---------------------------------------------------------------------------
  # Server mode, which asks for a login: the Redis password. pgAdmin reads it
  # only when it initialises an empty volume, so it keeps the password it was
  # first created with, and a changed password reaches it only once this volume
  # is removed — `yarn start`'s readiness names the command. The volume is named
  # for the login it holds; one created under the old fixed login is unused.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@phoenix.dev
      PGADMIN_DEFAULT_PASSWORD: ${AFLOW_DEV_REDIS_PASSWORD:-}
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - pgadmin_login:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  pgadmin_login:

# =============================================================================
# Usage:
#
# Start core services (with the machine's Redis password, ~/.aflow/stack.env):
#   yarn infra:up
#
# Start with admin tools (pgAdmin + Redis Commander, on 127.0.0.1, logging in
# with the machine's Redis password):
#   yarn infra:tools
#
# View logs:
#   docker compose logs -f postgres redis
#
# Connect to PostgreSQL:
#   psql postgres://phoenix:phoenix@localhost:5433/phoenix
#
# Connect to Redis:
#   REDISCLI_AUTH="$(sed -n 's/^AFLOW_DEV_REDIS_PASSWORD=//p' ~/.aflow/stack.env)" redis-cli
#
# =============================================================================
