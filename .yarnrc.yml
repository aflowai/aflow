# Reads may go through Yarn's mirror; a publish goes to npm itself.
npmPublishRegistry: 'https://registry.npmjs.org'
nodeLinker: node-modules

# GHSA-86w9-cpqp-85rv: node-forge's RSA PKCS#1 v1.5 verification accepts a
# malformed DigestInfo. No version above 1.4.0 fixes it, and the one dependent,
# @anthropic-ai/sandbox-runtime, only generates keys and signs its own proxy
# certificates; it verifies nothing with node-forge. Remove once node-forge
# publishes a fix.
#
# GHSA-ch52-4w7c-c8xp: http-cache-semantics' max-stale handling can let a
# shared cache serve one user's cached response to another. No version above
# 4.2.0 fixes it. Its one path is fsevents -> node-gyp -> make-fetch-happen,
# Yarn's build-time native-module helper fetching packages for a single
# operator; it never runs in the product and shares no cache between users.
# Remove once http-cache-semantics publishes a fix.
npmAuditIgnoreAdvisories:
  - '1240912'
  - '1240991'
