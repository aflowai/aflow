version: 2

updates:
  # Actions are pinned to commit SHAs, so nothing else moves them. Without this
  # entry a pin silently becomes an unmaintained snapshot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    groups:
      # OpenTelemetry versions its experimental packages 0.x, where a "minor"
      # bump may break, and its stable and experimental halves only work as a
      # matched set. Grouped apart, the family moves together and a breaking
      # release fails its own pull request rather than every other update.
      opentelemetry:
        patterns: ['@opentelemetry/*']
        update-types: ['minor', 'patch']
      # The linter's type-aware presets grow with every minor release: a bump
      # can turn hundreds of accepted lines into errors, which is a deliberate
      # cleanup rather than a line in a weekly batch. Grouped apart, it fails
      # alone and the rest of the batch still lands.
      typescript-eslint:
        patterns: ['typescript-eslint', '@typescript-eslint/*']
        update-types: ['minor', 'patch']
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Every workspace shares one lockfile, so a major lands as a deliberate
      # migration rather than a bot PR nobody can review in isolation.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
