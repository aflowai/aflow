syntax = "proto3";

package aflow.surface.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// =============================================================================
// Surface Streaming Service
//
// Bidirectional stream between executor and orchestrator for real-time
// surface mutation delivery. The executor generates UI mutations and
// streams them to the orchestrator, which forwards them to SSE/WebSocket
// consumers. The orchestrator can send control signals back.
//
// This extends Plan 20's StepProgressService with surface-specific messages.
// =============================================================================

service SurfaceStreamService {
  // Bidirectional stream for surface mutations.
  // Executor streams surface mutations; orchestrator streams control signals.
  rpc StreamSurface(stream SurfaceExecutorMessage) returns (stream SurfaceOrchestratorMessage);
}

// =============================================================================
// Executor → Orchestrator messages
// =============================================================================

message SurfaceExecutorMessage {
  oneof payload {
    SurfaceStreamStart stream_start = 1;
    SurfaceMutationMsg mutation = 2;
    SurfaceStreamComplete stream_complete = 3;
    SurfaceHeartbeat heartbeat = 4;
  }
}

// First message — identifies the surface and step execution context.
message SurfaceStreamStart {
  string tenant_id = 1;
  string run_id = 2;
  string step_execution_id = 3;
  string surface_id = 4;
  string catalog_version = 5;
  string trace_id = 6;
  string idempotency_key = 7;
}

// A validated surface mutation message (one JSONL line equivalent).
message SurfaceMutationMsg {
  string surface_id = 1;
  string message_id = 2;
  SurfaceMutationType type = 3;
  int64 timestamp_ms = 4;

  // The full mutation payload as JSON string.
  // Already validated by the executor before streaming.
  string payload_json = 5;

  // Sequence number for ordering guarantee.
  int64 sequence = 6;
}

enum SurfaceMutationType {
  SURFACE_MUTATION_TYPE_UNSPECIFIED = 0;
  CREATE_SURFACE = 1;
  UPDATE_COMPONENTS = 2;
  UPDATE_DATA_MODEL = 3;
  DELETE_SURFACE = 4;
  COMPLETE_SURFACE = 5;
  SURFACE_ERROR = 6;
}

// Final message — surface generation complete.
message SurfaceStreamComplete {
  string surface_id = 1;
  string step_execution_id = 2;
  int64 total_mutations = 3;
  int64 total_components = 4;
  int64 duration_ms = 5;
  // PayloadRef to the final surface snapshot.
  string snapshot_ref = 6;
}

message SurfaceHeartbeat {
  string surface_id = 1;
  int64 timestamp_ms = 2;
}

// =============================================================================
// Orchestrator → Executor messages (control signals)
// =============================================================================

message SurfaceOrchestratorMessage {
  oneof payload {
    SurfaceAck ack = 1;
    SurfaceCancelSignal cancel = 2;
    SurfaceActionEvent action_event = 3;
  }
}

// Acknowledgment after receiving SurfaceStreamStart.
message SurfaceAck {
  string surface_id = 1;
  bool accepted = 2;
  string rejection_reason = 3;
}

// Cancel the surface generation.
message SurfaceCancelSignal {
  string surface_id = 1;
  string reason = 2;
}

// Client action event forwarded to the executor (for interactive surfaces).
message SurfaceActionEvent {
  string surface_id = 1;
  string event_id = 2;
  string event_name = 3;
  string event_type = 4;
  string target = 5;
  string component_id = 6;
  // Resolved payload as JSON string.
  string payload_json = 7;
  // Full data model as JSON string (when includeDataModel: true).
  string data_model_json = 8;
}
