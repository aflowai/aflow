<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Orb: idle</title>
  <defs>
    <radialGradient id="oi-base" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#2B2752"/>
      <stop offset="100%" stop-color="#141129"/>
    </radialGradient>
    <radialGradient id="oi-halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#6C52D9" stop-opacity="0"/>
      <stop offset="84%" stop-color="#6C52D9" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#6C52D9" stop-opacity="0"/>
    </radialGradient>
    <filter id="oi-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="oi-clip"><circle cx="100" cy="100" r="58"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="74" fill="url(#oi-halo)">
    <animate attributeName="opacity" values=".7;1;.7" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="58" fill="url(#oi-base)"/>

  <!-- Muted aurora, drifting very slowly at coprime periods -->
  <g clip-path="url(#oi-clip)">
    <g transform="translate(100 100)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="29s" repeatCount="indefinite"/>
        <ellipse cx="20" cy="6" rx="36" ry="26" fill="#6C52D9" opacity=".5" filter="url(#oi-blur)">
          <animate attributeName="rx" values="36;30;36" dur="11s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="23s" repeatCount="indefinite"/>
        <ellipse cx="-18" cy="-10" rx="30" ry="22" fill="#3D6BD9" opacity=".4" filter="url(#oi-blur)">
          <animate attributeName="ry" values="22;28;22" dur="13s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="120;480" dur="19s" repeatCount="indefinite"/>
        <ellipse cx="8" cy="-22" rx="24" ry="18" fill="#4FB3A9" opacity=".3" filter="url(#oi-blur)"/>
      </g>
    </g>
  </g>

  <!-- Glass rim + top sheen -->
  <circle cx="100" cy="100" r="58" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="1.5"/>
  <ellipse cx="100" cy="66" rx="34" ry="14" fill="#FFFFFF" opacity=".07"/>
</svg>
