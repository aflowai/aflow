  .duck { animation: bob 3s ease-in-out infinite; }
  .b1 { animation: float1 4s infinite ease-in; animation-fill-mode: both; }
  .b2 { animation: float2 5s infinite ease-in 1.2s; animation-fill-mode: both; }
  .b3 { animation: float3 4.5s infinite ease-in 2.5s; animation-fill-mode: both; }
  .b4 { animation: float4 6s infinite ease-in 0.5s; animation-fill-mode: both; }
  .rip1 { animation: rip1 3s ease-in-out infinite; transform-origin: 95px 145px; }
  .rip2 { animation: rip2 3s ease-in-out infinite 0.5s; transform-origin: 95px 152px; }
</style>
