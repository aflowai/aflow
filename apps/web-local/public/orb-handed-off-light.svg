<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Orb: handed off (light)</title>
  <defs>
    <radialGradient id="ohl-base" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#F3F3F2"/>
      <stop offset="100%" stop-color="#D6D8DA"/>
    </radialGradient>
    <radialGradient id="ohl-halo" cx="72%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#7E94B8" stop-opacity="0"/>
      <stop offset="84%" stop-color="#7E94B8" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#7E94B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="ohl-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="ohl-clip"><circle cx="100" cy="100" r="58"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="74" fill="url(#ohl-halo)"/>
  <circle cx="100" cy="100" r="58" fill="url(#ohl-base)"/>

  <g clip-path="url(#ohl-clip)">
    <g transform="translate(100 100)">
      <ellipse cx="-14" cy="4" rx="30" ry="22" fill="#9A968E" opacity=".3" filter="url(#ohl-blur)"/>
      <ellipse cx="0" cy="-4" rx="26" ry="18" fill="#7E94B8" filter="url(#ohl-blur)">
        <animate attributeName="cx" values="-6;46" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.5;.5;0" keyTimes="0;.2;.7;1" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="0" cy="10" rx="20" ry="14" fill="#6FA3AD" filter="url(#ohl-blur)">
        <animate attributeName="cx" values="-10;42" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;.35;0" keyTimes="0;.25;.7;1" dur="13s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <circle cx="100" cy="100" r="58" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="1.5"/>
  <ellipse cx="100" cy="64" rx="28" ry="10" fill="#FFFBF5" opacity=".28"/>
</svg>
