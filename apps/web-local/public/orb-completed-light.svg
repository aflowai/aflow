<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Orb: completed (light)</title>
  <defs>
    <radialGradient id="ocl-base" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#EEF9F5"/>
      <stop offset="100%" stop-color="#B8E0D4"/>
    </radialGradient>
    <radialGradient id="ocl-halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#F4FFFB" stop-opacity="0"/>
      <stop offset="84%" stop-color="#F4FFFB" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#F4FFFB" stop-opacity="0"/>
    </radialGradient>
    <filter id="ocl-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="ocl-clip"><circle cx="100" cy="100" r="58"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="74" fill="url(#ocl-halo)"/>
  <circle cx="100" cy="100" r="58" fill="url(#ocl-base)"/>

  <g clip-path="url(#ocl-clip)">
    <g transform="translate(100 100)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="31s" repeatCount="indefinite"/>
        <ellipse cx="16" cy="4" rx="36" ry="26" fill="#2C9A8E" opacity=".55" filter="url(#ocl-blur)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="23s" repeatCount="indefinite"/>
        <ellipse cx="-14" cy="-8" rx="30" ry="22" fill="#4A72C4" opacity=".4" filter="url(#ocl-blur)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="160;520" dur="27s" repeatCount="indefinite"/>
        <ellipse cx="6" cy="-22" rx="22" ry="16" fill="#5BC4B0" opacity=".5" filter="url(#ocl-blur)"/>
      </g>
    </g>
  </g>

  <circle cx="100" cy="100" r="58" fill="none" stroke="#1E6B60" stroke-opacity=".22" stroke-width="1.5"/>
  <ellipse cx="100" cy="64" rx="28" ry="10" fill="#F4FFFB" opacity=".3"/>
</svg>
