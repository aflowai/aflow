<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Orb: running</title>
  <defs>
    <radialGradient id="ow-base" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#141129"/>
    </radialGradient>
    <radialGradient id="ow-halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#ccc" stop-opacity="0"/>
      <stop offset="72%" stop-color="#ccc" stop-opacity=".1"/>
      <stop offset="100%" stop-color="#ccc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ow-sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".5"/>
    </linearGradient>
    <filter id="ow-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="ow-blur-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="ow-clip"><circle cx="100" cy="100" r="58"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="74" fill="url(#ow-halo)">
    <animate attributeName="opacity" values=".8;1;.8" dur="2.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="58" fill="url(#ow-base)"/>

  <!-- Lively aurora: faster drift, coprime periods so it never visibly loops -->
  <g clip-path="url(#ow-clip)">
    <g transform="translate(100 100)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="5.3s" repeatCount="indefinite"/>
        <ellipse cx="22" cy="4" rx="36" ry="26" fill="#6C52D9" opacity=".8" filter="url(#ow-blur)">
          <animate attributeName="rx" values="36;28;36" dur="3.1s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.3s" repeatCount="indefinite"/>
        <ellipse cx="-18" cy="-8" rx="30" ry="22" fill="#F2695C" opacity=".55" filter="url(#ow-blur)">
          <animate attributeName="ry" values="22;29;22" dur="3.7s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="140;500" dur="6.7s" repeatCount="indefinite"/>
        <ellipse cx="8" cy="-24" rx="24" ry="16" fill="#FFD23F" opacity=".45" filter="url(#ow-blur)"/>
      </g>

      <!-- Orbiting highlight: the "processing" sweep -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="2.9s" repeatCount="indefinite"/>
        <path d="M0 -58 A58 58 0 0 1 41 -41 L28 -28 A40 40 0 0 0 0 -40 Z" fill="url(#ow-sweep)" filter="url(#ow-blur-soft)"/>
      </g>
    </g>
  </g>

  <circle cx="100" cy="100" r="58" fill="none" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="0.5"/>
  <ellipse cx="100" cy="66" rx="34" ry="14" fill="#FFFFFF" opacity=".06"/>
</svg>
