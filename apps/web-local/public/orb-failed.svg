<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Orb: failed</title>
  <defs>
    <radialGradient id="of-base" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#3A2230"/>
      <stop offset="100%" stop-color="#1A0F16"/>
    </radialGradient>
    <radialGradient id="of-halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#E05252" stop-opacity="0"/>
      <stop offset="84%" stop-color="#E05252" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#E05252" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="of-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2695C" stop-opacity=".55"/>
      <stop offset="70%" stop-color="#D14545" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#D14545" stop-opacity="0"/>
    </radialGradient>
    <filter id="of-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="of-clip"><circle cx="100" cy="100" r="58"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="74" fill="url(#of-halo)">
    <animate attributeName="opacity" values=".7;1;.7" dur="6.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="58" fill="url(#of-base)"/>

  <!-- Ember aurora: heavy, slow, unmistakably wrong, but no flashing. -->
  <g clip-path="url(#of-clip)">
    <g transform="translate(100 100)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="37s" repeatCount="indefinite"/>
        <ellipse cx="16" cy="6" rx="36" ry="26" fill="#D14545" opacity=".5" filter="url(#of-blur)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="29s" repeatCount="indefinite"/>
        <ellipse cx="-14" cy="-8" rx="28" ry="20" fill="#8A3060" opacity=".45" filter="url(#of-blur)"/>
      </g>
      <!-- Uneven ember breathing: two coprime periods make the rhythm feel unsettled -->
      <circle r="26" fill="url(#of-core)">
        <animate attributeName="r" values="24;30;24" dur="4.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".7;1;.7" dur="3.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <circle cx="100" cy="100" r="58" fill="none" stroke="#E05252" stroke-opacity=".25" stroke-width="1.5"/>
  <ellipse cx="100" cy="66" rx="34" ry="14" fill="#FFFFFF" opacity=".06"/>
</svg>
