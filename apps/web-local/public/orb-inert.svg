<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Orb: inert</title>
  <defs>
    <radialGradient id="ob-base" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#2A2A38"/>
      <stop offset="100%" stop-color="#131318"/>
    </radialGradient>
    <radialGradient id="ob-halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#8A87A0" stop-opacity="0"/>
      <stop offset="84%" stop-color="#8A87A0" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#8A87A0" stop-opacity="0"/>
    </radialGradient>
    <filter id="ob-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="ob-clip"><circle cx="100" cy="100" r="58"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="74" fill="url(#ob-halo)"/>
  <circle cx="100" cy="100" r="58" fill="url(#ob-base)"/>

  <!-- Desaturated aurora, nearly frozen -->
  <g clip-path="url(#ob-clip)">
    <g transform="translate(100 100)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="67s" repeatCount="indefinite"/>
        <ellipse cx="16" cy="6" rx="34" ry="24" fill="#6B6885" opacity=".4" filter="url(#ob-blur)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="53s" repeatCount="indefinite"/>
        <ellipse cx="-16" cy="-8" rx="28" ry="20" fill="#4E5A70" opacity=".35" filter="url(#ob-blur)"/>
      </g>
      <!-- The one hint of life: a slow, patient breath -->
      <circle r="24" fill="#8A87A0" opacity=".12" filter="url(#ob-blur)">
        <animate attributeName="r" values="24;29;24" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <circle cx="100" cy="100" r="58" fill="none" stroke="#FFFFFF" stroke-opacity=".1" stroke-width="1.5"/>
  <ellipse cx="100" cy="66" rx="34" ry="14" fill="#FFFFFF" opacity=".05"/>
</svg>
