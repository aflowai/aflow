<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Orb: running (light)</title>
  <defs>
    <radialGradient id="owl-base" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#eee7de66"/>
      <stop offset="100%" stop-color="#e9c6e222"/>
    </radialGradient>
    <radialGradient id="owl-halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#eee7de89" stop-opacity="0"/>
      <stop offset="84%" stop-color="#eee7de66" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#eee7de66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="owl-sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8EE" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFF8EE" stop-opacity=".55"/>
    </linearGradient>
    <filter id="owl-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="owl-blur-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="owl-clip"><circle cx="100" cy="100" r="58"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="74" fill="url(#owl-halo)">
    <animate attributeName="opacity" values=".75;1;.75" dur="2.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="58" fill="url(#owl-base)"/>

  <g clip-path="url(#owl-clip)">
    <g transform="translate(100 100)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="5.3s" repeatCount="indefinite"/>
        <ellipse cx="22" cy="4" rx="36" ry="26" fill="#7A58D4" opacity=".72" filter="url(#owl-blur)">
          <animate attributeName="rx" values="36;28;36" dur="3.1s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.3s" repeatCount="indefinite"/>
        <ellipse cx="-18" cy="-8" rx="30" ry="22" fill="#E85A48" opacity=".55" filter="url(#owl-blur)">
          <animate attributeName="ry" values="22;29;22" dur="3.7s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="140;500" dur="6.7s" repeatCount="indefinite"/>
        <ellipse cx="8" cy="-24" rx="24" ry="16" fill="#E8A020" opacity=".55" filter="url(#owl-blur)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="2.9s" repeatCount="indefinite"/>
        <path d="M0 -58 A58 58 0 0 1 41 -41 L28 -28 A40 40 0 0 0 0 -40 Z" fill="url(#owl-sweep)" filter="url(#owl-blur-soft)"/>
      </g>
    </g>
  </g>

  <circle cx="100" cy="100" r="58" fill="none" stroke="#999" stroke-opacity=".32" stroke-width="0.5"/>
  <ellipse cx="100" cy="64" rx="28" ry="10" fill="#FFF8EE" opacity=".3"/>
</svg>
