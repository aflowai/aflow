<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Orb: paused (light)</title>
  <defs>
    <radialGradient id="opl-base" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#FFF3D6"/>
      <stop offset="100%" stop-color="#F0C86A"/>
    </radialGradient>
    <radialGradient id="opl-halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#E8A020" stop-opacity="0"/>
      <stop offset="84%" stop-color="#E8A020" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#E8A020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="opl-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE08A" stop-opacity="1"/>
      <stop offset="55%" stop-color="#F5B84A" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#E89A18" stop-opacity="0"/>
    </radialGradient>
    <filter id="opl-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="opl-clip"><circle cx="100" cy="100" r="58"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="74" fill="url(#opl-halo)">
    <animate attributeName="opacity" values=".7;1;.7" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="58" fill="url(#opl-base)"/>

  <g clip-path="url(#opl-clip)">
    <g transform="translate(100 100)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="41s" repeatCount="indefinite"/>
        <ellipse cx="12" cy="4" rx="34" ry="26" fill="#E8A020" opacity=".55" filter="url(#opl-blur)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="37s" repeatCount="indefinite"/>
        <ellipse cx="-12" cy="-6" rx="30" ry="22" fill="#D4783A" opacity=".4" filter="url(#opl-blur)"/>
      </g>
      <circle r="30" fill="url(#opl-core)">
        <animate attributeName="r" values="28;34;28;28" keyTimes="0;.14;.3;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".9;1;.9;.9" keyTimes="0;.14;.3;1" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <circle cx="100" cy="100" r="58" fill="none" stroke="#E8A020" stroke-width="2">
    <animate attributeName="r" values="58;58;70;70" keyTimes="0;.1;.4;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;.7;0;0" keyTimes="0;.12;.4;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="100" cy="100" r="58" fill="none" stroke="#A86E10" stroke-opacity=".28" stroke-width="1.5"/>
  <ellipse cx="100" cy="64" rx="28" ry="10" fill="#FFF8E0" opacity=".28"/>
</svg>
