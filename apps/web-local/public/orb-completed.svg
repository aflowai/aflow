<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Orb: completed</title>
  <defs>
    <radialGradient id="oc-base" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#1E3A38"/>
      <stop offset="100%" stop-color="#0E1F1D"/>
    </radialGradient>
    <radialGradient id="oc-halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#7FD4CB" stop-opacity="0"/>
      <stop offset="84%" stop-color="#7FD4CB" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#7FD4CB" stop-opacity="0"/>
    </radialGradient>
    <filter id="oc-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="oc-clip"><circle cx="100" cy="100" r="58"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="74" fill="url(#oc-halo)"/>
  <circle cx="100" cy="100" r="58" fill="url(#oc-base)"/>

  <!-- Settled teal aurora: bright enough to read "healthy", slow enough
       to read "finished". No pulse ring: nothing is asked of the user. -->
  <g clip-path="url(#oc-clip)">
    <g transform="translate(100 100)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="31s" repeatCount="indefinite"/>
        <ellipse cx="16" cy="4" rx="36" ry="26" fill="#4FB3A9" opacity=".6" filter="url(#oc-blur)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="23s" repeatCount="indefinite"/>
        <ellipse cx="-14" cy="-8" rx="30" ry="22" fill="#2F8A7A" opacity=".4" filter="url(#oc-blur)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="160;520" dur="27s" repeatCount="indefinite"/>
        <ellipse cx="6" cy="-22" rx="22" ry="16" fill="#7FD4CB" opacity=".35" filter="url(#oc-blur)"/>
      </g>
    </g>
  </g>

  <circle cx="100" cy="100" r="58" fill="none" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="1.5"/>
  <ellipse cx="100" cy="66" rx="34" ry="14" fill="#FFFFFF" opacity=".04"/>
</svg>
