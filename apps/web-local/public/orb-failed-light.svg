<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Orb: failed (light)</title>
  <defs>
    <radialGradient id="ofl-base" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#FFF0EC"/>
      <stop offset="100%" stop-color="#F0B8AE"/>
    </radialGradient>
    <radialGradient id="ofl-halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#D14545" stop-opacity="0"/>
      <stop offset="84%" stop-color="#D14545" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#D14545" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ofl-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2695C" stop-opacity=".7"/>
      <stop offset="70%" stop-color="#D14545" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#D14545" stop-opacity="0"/>
    </radialGradient>
    <filter id="ofl-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="ofl-clip"><circle cx="100" cy="100" r="58"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="74" fill="url(#ofl-halo)">
    <animate attributeName="opacity" values=".7;1;.7" dur="6.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="58" fill="url(#ofl-base)"/>

  <g clip-path="url(#ofl-clip)">
    <g transform="translate(100 100)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="37s" repeatCount="indefinite"/>
        <ellipse cx="16" cy="6" rx="36" ry="26" fill="#D14545" opacity=".5" filter="url(#ofl-blur)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="29s" repeatCount="indefinite"/>
        <ellipse cx="-14" cy="-8" rx="28" ry="20" fill="#C05070" opacity=".45" filter="url(#ofl-blur)"/>
      </g>
      <circle r="26" fill="url(#ofl-core)">
        <animate attributeName="r" values="24;30;24" dur="4.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".75;1;.75" dur="3.1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <circle cx="100" cy="100" r="58" fill="none" stroke="#B03030" stroke-opacity=".32" stroke-width="1.5"/>
  <ellipse cx="100" cy="64" rx="28" ry="10" fill="#FFF5F0" opacity=".28"/>
</svg>
