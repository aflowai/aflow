<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Orb: inert (light)</title>
  <defs>
    <radialGradient id="oil-base" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#F5F2EE"/>
      <stop offset="100%" stop-color="#DCD6CE"/>
    </radialGradient>
    <radialGradient id="oil-halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#FFFBF5" stop-opacity="0"/>
      <stop offset="84%" stop-color="#FFFBF5" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#FFFBF5" stop-opacity="0"/>
    </radialGradient>
    <filter id="oil-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="oil-clip"><circle cx="100" cy="100" r="58"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="74" fill="url(#oil-halo)"/>
  <circle cx="100" cy="100" r="58" fill="url(#oil-base)"/>

  <g clip-path="url(#oil-clip)">
    <g transform="translate(100 100)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="67s" repeatCount="indefinite"/>
        <ellipse cx="16" cy="6" rx="34" ry="24" fill="#A09890" opacity=".4" filter="url(#oil-blur)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="53s" repeatCount="indefinite"/>
        <ellipse cx="-16" cy="-8" rx="28" ry="20" fill="#8A8070" opacity=".35" filter="url(#oil-blur)"/>
      </g>
      <circle r="24" fill="#8A8078" opacity=".16" filter="url(#oil-blur)">
        <animate attributeName="r" values="24;29;24" dur="7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <circle cx="100" cy="100" r="58" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="1.5"/>
  <ellipse cx="100" cy="64" rx="28" ry="10" fill="#FFFBF5" opacity=".28"/>
</svg>
