<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <title>Orb: idle (light)</title>
  <defs>
    <radialGradient id="oidl-base" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#F7F2FA"/>
      <stop offset="100%" stop-color="#DCCFE8"/>
    </radialGradient>
    <radialGradient id="oidl-halo" cx="50%" cy="50%" r="50%">
      <stop offset="62%" stop-color="#7A58D4" stop-opacity="0"/>
      <stop offset="84%" stop-color="#7A58D4" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#7A58D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="oidl-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <clipPath id="oidl-clip"><circle cx="100" cy="100" r="58"/></clipPath>
  </defs>

  <circle cx="100" cy="100" r="74" fill="url(#oidl-halo)">
    <animate attributeName="opacity" values=".7;1;.7" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="100" r="58" fill="url(#oidl-base)"/>

  <g clip-path="url(#oidl-clip)">
    <g transform="translate(100 100)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="29s" repeatCount="indefinite"/>
        <ellipse cx="20" cy="6" rx="36" ry="26" fill="#7A58D4" opacity=".48" filter="url(#oidl-blur)">
          <animate attributeName="rx" values="36;30;36" dur="11s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="23s" repeatCount="indefinite"/>
        <ellipse cx="-18" cy="-10" rx="30" ry="22" fill="#5A72C4" opacity=".4" filter="url(#oidl-blur)">
          <animate attributeName="ry" values="22;28;22" dur="13s" repeatCount="indefinite"/>
        </ellipse>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="120;480" dur="19s" repeatCount="indefinite"/>
        <ellipse cx="8" cy="-22" rx="24" ry="18" fill="#3A9A8E" opacity=".38" filter="url(#oidl-blur)"/>
      </g>
    </g>
  </g>

  <circle cx="100" cy="100" r="58" fill="none" stroke="#5A3A9A" stroke-opacity=".2" stroke-width="1.5"/>
  <ellipse cx="100" cy="64" rx="28" ry="10" fill="#FFF8FF" opacity=".28"/>
</svg>
